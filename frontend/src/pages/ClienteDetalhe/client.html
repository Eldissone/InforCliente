<!DOCTYPE html>

<html class="light" lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Info Gestor - Detalhe do Parceiro</title>
    <link rel="icon" href="../../assets/icon/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="/assets/styles/tailwind-app.css" rel="stylesheet" />
    <link href="/assets/styles/shared-ui.css" rel="stylesheet" />
    <link href="/assets/styles/top-nav.css" rel="stylesheet" />
    <link href="/assets/styles/shell.css" rel="stylesheet" />
    <link href="/assets/styles/pages/client-detail.css" rel="stylesheet" />
</head>

<body data-shell="figma" class="bg-surface antialiased text-slate-900 min-h-screen">
    <!-- Top Navigation Bar -->
    <div id="appHeader"></div>
    <!-- Main Content -->
    <main class="max-w-[1500px] mx-auto px-4 md:px-8 pt-24 pb-20">
        <!-- Header: Client ID & Health -->
        <header class="flex flex-col gap-8 mb-12">
            <nav class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-400">
                <span>Clientes</span>
                <span class="material-symbols-outlined text-xs">chevron_right</span>
                <span id="clientBreadcrumb" class="text-[#0d3fd1]">Detalhe</span>
            </nav>
            <div class="flex flex-col md:flex-row items-center md:items-start gap-8">
                <div class="relative group">
                    <img alt="Perfil" id="clientProfilePic"
                        class="w-32 h-32 rounded-[32px] object-cover ring-4 ring-white shadow-2xl transition-all duration-500 group-hover:scale-105"
                        src="/assets/img/placeholder-user.png" />
                    <div
                        class="absolute -bottom-2 -right-2 w-10 h-10 bg-[#2afc8d] border-4 border-white rounded-full flex items-center justify-center text-[#212e3e] shadow-lg">
                        <span class="material-symbols-outlined text-base font-bold">verified</span>
                    </div>
                </div>

                <div class="text-center md:text-left">
                    <div class="flex flex-wrap items-center justify-center md:justify-start gap-4 mb-3">
                        <h1 id="clientName" class="text-3xl md:text-4xl font-bold tracking-tight text-slate-900">—</h1>
                        <span id="clientCode"
                            class="bg-slate-100 px-3 py-1 rounded-lg text-[10px] font-black tracking-widest uppercase text-slate-400">ID:
                            —</span>
                        <div id="clientStatusBadge"></div>
                    </div>

                    <div
                        class="flex flex-wrap justify-center md:justify-start items-center gap-6 text-slate-500 font-medium text-sm">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-lg text-blue-600">mail</span>
                            <span id="clientAccountEmail">—</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-lg text-emerald-600">location_on</span>
                            <span id="clientLocationTier">—</span>
                        </div>
                    </div>

                    <div id="clientTags" class="flex flex-wrap justify-center md:justify-start gap-2 mt-6"></div>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Sections -->
        <div class="grid grid-cols-12 gap-8">
            <!-- Projects Section -->
            <section class="col-span-12 bg-white p-8 rounded-2xl border border-slate-100 shadow-sm">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
                    <div>
                        <h3 class="text-2xl font-bold text-slate-900">Obras Vinculadas</h3>
                        <p class="text-slate-500 font-medium mt-1">Status e progresso físico das frentes de trabalho.
                        </p>
                    </div>
                    <div id="clientProjectsCount"
                        class="h-10 px-5 rounded-xl bg-slate-900 text-[#2afc8d] flex items-center text-xs font-black uppercase tracking-widest shadow-lg shadow-slate-900/10">
                        0 Obras
                    </div>
                </div>
                <div id="clientProjects" class="grid grid-cols-1 lg:grid-cols-2 gap-8"></div>
            </section>


        </div>

    </main>

    <script type="module" src="./client.js"></script>
</body>

</html>
