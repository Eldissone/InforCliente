<!DOCTYPE html>

<html lang="pt-PT">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Info Gestor - Gestão de Obras</title>
  <link rel="icon" href="../../assets/icon/favicon.ico" type="image/x-icon">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link href="/assets/styles/tailwind-app.css" rel="stylesheet" />
  <link href="/assets/styles/shared-ui.css" rel="stylesheet" />
  <link href="/assets/styles/top-nav.css" rel="stylesheet" />
    <link href="/assets/styles/shell.css" rel="stylesheet" />
  <link href="/assets/styles/pages/projects.css" rel="stylesheet" />
</head>

<body data-shell="figma" class="bg-surface antialiased text-slate-900 min-h-screen">
  <!-- Top Navigation Bar -->
  <div id="appHeader"></div>
    <main class="max-w-[1500px] mx-auto px-4 md:px-8 pt-24 pb-20">
    <!-- Header Section -->
    <header class="flex flex-row items-center justify-between gap-4 mb-10">
      <div>
        <nav class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">
          <span>Obras</span>
          <span class="material-symbols-outlined text-xs">chevron_right</span>
          <span class="text-[#0d3fd1]">Portfolio de Obras</span>
        </nav>
        <h1 class="text-3xl md:text-4xl font-bold text-slate-900 tracking-tight leading-none mb-3">Gerenciamento de
          Obras</h1>
        <p class="text-slate-500 font-medium max-w-2xl">Monitoramento técnico e financeiro em tempo real.</p>
      </div>
      <button id="addProjectBtn" data-role-visible="admin,operador"
        class="h-10 bg-slate-900 text-white px-6 rounded-xl font-bold flex items-center gap-2 shadow-xl shadow-slate-900/10 hover:scale-105 active:scale-95 transition-all">
        Nova Obra
        <span class="material-symbols-outlined text-xl">add_circle</span>
      </button>
    </header>

    <!-- Filter Bar -->
    <div class="mb-8 flex flex-col lg:flex-row gap-4">
      <div class="flex-1 relative">
        <input id="projectsSearch"
          class="w-full h-10 bg-white border border-slate-100 rounded-2xl pl-12 pr-4 text-sm focus:ring-2 focus:ring-[#2afc8d]/20 transition-all shadow-sm"
          placeholder="Buscar obras por nome, referência ou cliente..." type="text" />
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">search</span>
      </div>

      <div class="flex flex-row items-center gap-2 overflow-x-auto pb-2 lg:pb-0 no-scrollbar">
        <div
          class="h-10 min-w-[130px] border border-slate-100 bg-white rounded-2xl px-3 flex items-center shadow-sm shrink-0">
          <select id="projectsStatus"
            class="w-full border-none bg-transparent text-xs font-bold text-slate-600 focus:ring-0">
            <option value="">Status</option>
            <option value="NOT_STARTED">Por Iniciar</option>
            <option value="ACTIVE">Em Execução</option>
            <option value="ON_HOLD">Em Pausa</option>
            <option value="COMPLETED">Concluído</option>
          </select>
        </div>

        <div
          class="h-10 min-w-[130px] border border-slate-100 bg-white rounded-2xl px-3 flex items-center shadow-sm shrink-0">
          <select id="projectsRegion"
            class="w-full border-none bg-transparent text-xs font-bold text-slate-600 focus:ring-0">
            <option value="">Regiões</option>
          </select>
        </div>

        <div class="flex h-11 bg-white border border-slate-100 rounded-2xl p-1 shadow-sm shrink-0 ml-auto">
          <button id="btnViewGrid"
            class="w-10 h-full rounded-xl text-slate-400 flex items-center justify-center hover:text-slate-900 transition-colors">
            <span class="material-symbols-outlined text-xl">grid_view</span>
          </button>
          <button id="btnViewList"
            class="w-10 h-full rounded-xl bg-slate-900 text-[#2afc8d] flex items-center justify-center shadow-lg">
            <span class="material-symbols-outlined text-xl">list</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Grid Container -->
    <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12 hidden"></div>

    <!-- Table Container -->
    <section id="projectsTableContainer"
      class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden mb-12">
      <div class="max-h-[calc(100vh-280px)] overflow-auto">
        <table class="w-full text-left">
          <thead class="sticky top-0 z-10">
            <tr
              class="bg-slate-50 text-slate-500 text-[10px] font-black uppercase tracking-widest text-center md:text-left">
              <th class="px-8 py-5 bg-slate-50">Obra</th>
              <th class="px-8 py-5 bg-slate-50">Cliente</th>
              <th class="px-8 py-5 bg-slate-50">Contacto</th>
              <th class="px-8 py-5 bg-slate-50">Morada</th>
              <th class="px-8 py-5 text-right bg-slate-50">Orçamento</th>
              <th class="px-8 py-5 text-center bg-slate-50">Progresso</th>
              <th class="px-8 py-5 text-center bg-slate-50">Status</th>
              <th class="px-8 py-5 text-right bg-slate-50">Acção</th>
            </tr>
          </thead>
          <tbody id="projectsTbody" class="divide-y divide-slate-50"></tbody>
        </table>
      </div>
    </section>

  </main>

  <script type="module" src="./ProjectGeral.js"></script>
</body>
</body>

</html>
