<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planeamento — a redirecionar…</title>
  <!-- Página descontinuada: o orçamento e o planeamento vivem agora dentro de cada obra (projectView). -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var pid = q.get("projectId") || q.get("project") || q.get("id");
      if (!pid) { location.replace("./ProjectGeral.html"); return; }
      var out = new URLSearchParams({ id: pid });
      ["tab", "sub", "needId", "quoteId", "scan"].forEach(function (k) { if (q.get(k)) out.set(k, q.get(k)); });
      if (!out.get("tab")) out.set("tab", "orcamento_custo");
      location.replace("./projectView.html?" + out.toString());
    })();
  </script>
</head>
<body></body>
</html>
