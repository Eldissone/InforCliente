<!DOCTYPE html>
<html class="light" lang="pt">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Info Gestor - Logística &amp; Stock</title>
    <link rel="icon" href="../../assets/icon/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="/assets/styles/tailwind-app.css" rel="stylesheet" />
    <link href="/assets/styles/shared-ui.css" rel="stylesheet" />
    <link href="/assets/styles/top-nav.css" rel="stylesheet" />
    <link href="/assets/styles/shell.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <link href="/assets/styles/pages/stock.css" rel="stylesheet" />
</head>

<body data-shell="figma" class="bg-surface font-body text-on-surface antialiased pb-20">
    <!-- ═══════════════ TOP NAV ═══════════════ -->
    <div id="appHeader"></div>
    <main class="max-w-[1500px] mx-auto px-4 md:px-8 pt-24 pb-20">

        <!-- ═══════════════ PAGE HEADER ═══════════════ -->
        <header class="flex flex-col sm:flex-row sm:items-end justify-between gap-6 mb-10">
            <div>
                <nav
                    class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">
                    <span>Logística</span>
                    <span class="material-symbols-outlined text-xs">chevron_right</span>
                    <span class="text-[#0d3fd1]">Inventário &amp; Ativos</span>
                </nav>
                <h1 class="text-3xl md:text-4xl font-bold text-slate-900 tracking-tight leading-none mb-2">Gestão
                    Logística</h1>
                <p class="text-slate-500 font-medium text-sm">Pedidos de obra, devoluções, entregas e histórico de movimentos.</p>
            </div>
            <!-- Action Buttons: aligned to the right -->
            <div class="flex items-center justify-end w-full sm:w-auto gap-3 shrink-0">
                <button id="btnNewExtra" type="button"
                    class="h-10 px-4 rounded-xl bg-[#2afc8d] text-[#212e3e] text-xs font-black flex items-center gap-2 hover:opacity-90 transition-all shadow-md shadow-[#2afc8d]/20 shrink-0">
                    <span class="material-symbols-outlined text-base">add</span>
                    Pedido de Compra
                </button>
                <button id="btnTransfer"
                    class="h-10 bg-white border border-slate-200 text-slate-700 px-4 sm:px-6 rounded-xl font-bold flex items-center gap-2 shadow-sm hover:shadow-md hover:border-slate-300 active:scale-95 transition-all text-sm whitespace-nowrap">
                    <span class="material-symbols-outlined text-xl">swap_horiz</span>
                    <span class="hidden sm:inline">Transferir</span>
                </button>
                <button id="btnNewEntry"
                    class="h-10 bg-slate-900 text-[#2afc8d] px-4 sm:px-6 rounded-xl font-bold flex items-center gap-2 shadow-xl shadow-slate-900/10 hover:scale-105 active:scale-95 transition-all text-sm whitespace-nowrap">
                    <span class="material-symbols-outlined text-xl">add_shopping_cart</span>
                    <span class="hidden sm:inline">Nova Entrada</span>
                </button>
            </div>
        </header>

        <!-- ═══════════════ TABS ═══════════════ -->
        <div class="flex gap-1 sm:gap-6 border-b border-slate-200 mb-8 overflow-x-auto no-scrollbar">
            <button data-tab="requests" data-perm="obras:tab_stock_requests"
                class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent relative">
                <span class="material-symbols-outlined text-lg">fact_check</span>
                <span class="tab-label">Pedidos de Obra</span>
                <span id="requests_badge"
                    class="hidden absolute top-3 right-0 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
            </button>
            <button data-tab="returns" data-perm="stock:tab_returns"
                class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent relative">
                <span class="material-symbols-outlined text-lg">undo</span>
                <span class="tab-label">Devoluções</span>
                <span id="returns_badge"
                    class="hidden absolute top-3 right-0 w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
            </button>
            <button data-tab="deliveries" data-perm="logistica:tab_deliveries"
                class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent">
                <span class="material-symbols-outlined text-lg">local_shipping</span>
                <span class="tab-label">Entregas</span>
            </button>
            <!-- <button data-tab="freight" data-perm="logistica:tab_deliveries"
                class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent">
                <span class="material-symbols-outlined text-lg">local_shipping</span>
                <span class="tab-label">Frete</span>
            </button> -->
            <button data-tab="movements" data-perm="stock:tab_movements"
                class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent">
                <span class="material-symbols-outlined text-lg">history</span>
                <span class="tab-label">Histórico</span>
            </button>
        </div>

        <!-- ═══════════════ TAB CONTENT ═══════════════ -->
        <div id="tabContent" class="min-h-[400px]">
            <div class="flex items-center justify-center py-20">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#2afc8d]"></div>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="modalContainer"></div>

    <div id="imageLightbox">
        <div class="close-btn" id="closeLightbox" role="button" tabindex="0" aria-label="Fechar">
            <span class="material-symbols-outlined text-3xl">close</span>
        </div>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="Preview" />
        </div>
        <div class="lightbox-info">
            <h3 id="lightboxTitle" class="text-2xl font-black text-[#2afc8d] mb-1"></h3>
        </div>
    </div>

    <script src="../../shared/session.js" type="module"></script>
    <script src="./stock.js" type="module"></script>
</body>

</html>
