<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Info Cliente - Logística & Stock</title>
    <link rel="icon" href="../../assets/icon/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="/assets/styles/tailwind-app.css" rel="stylesheet" />
    <link href="/assets/styles/shared-ui.css" rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
        }

        .tab-active {
            color: #080808;
            border-bottom: 1px solid #2afc8d;
        }
    </style>
</head>

<body class="bg-surface font-body text-on-surface antialiased pb-20">
    <!-- Top Navigation Bar -->
    <nav class="fixed top-0 w-full z-50 bg-[#0F172A] border-b border-slate-800 transition-all duration-300">
        <div class="max-w-[1440px] mx-auto px-4 md:px-8 h-16 flex justify-between items-center">
            <div class="flex items-center gap-10">
                <span class="text-xl font-bold text-white tracking-tight flex items-center gap-2 pointer">
                    <span
                        class="w-14 h-8 bg-[#2afc8d] rounded-lg flex items-center justify-center text-[#0F172A] font-black italic">Info</span>
                    <span>Cliente</span>
                </span>
                <div class="hidden lg:flex items-center gap-6">
                    <a class="text-sm font-semibold text-slate-400 hover:text-white transition-colors"
                        href="../Dashboard/index.html">Dashboard</a>
                    <a class="text-sm font-semibold text-slate-400 hover:text-white transition-colors"
                        href="../Clientes/clienteLista.html">Clientes</a>
                    <a class="text-sm font-semibold text-slate-400 hover:text-white transition-colors"
                        href="../Projectos/ProjectGeral.html">Obras</a>
                    <a class="text-sm font-semibold text-[#2afc8d] transition-all bg-[#2afc8d]/10 px-3 py-1.5 rounded-lg"
                        href="./index.html">Logística</a>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a data-nav-users
                    class="hidden px-3 py-1.5 rounded-lg text-xs font-bold text-white/80 hover:text-white hover:bg-white/10 transition-all flex items-center gap-2"
                    href="../Users/index.html">
                    <span class="material-symbols-outlined text-lg">manage_accounts</span> Gestão
                </a>
                <button data-user-profile
                    class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold text-[#2afc8d] hover:bg-[#2afc8d]/10 transition-all">
                    <span class="material-symbols-outlined text-sm">person</span> <span data-user-role></span>
                </button>
                <button data-logout
                    class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold text-white/60 hover:text-white transition-all">Sair</button>
            </div>
        </div>
    </nav>

    <main class="max-w-[1440px] mx-auto px-4 md:px-8 pt-24 pb-20">
        <!-- Header Section -->
        <header class="flex flex-row items-center justify-between gap-4 mb-10">
            <div>
                <nav
                    class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">
                    <span>Logística</span>
                    <span class="material-symbols-outlined text-xs">chevron_right</span>
                    <span class="text-[#0d3fd1]">Inventário & Ativos</span>
                </nav>
                <h1 class="text-3xl md:text-4xl font-bold text-slate-900 tracking-tight leading-none mb-3">Gestão
                    Logística</h1>
                <p class="text-slate-500 font-medium">Controlo profissional de armazéns, materiais e ativos.</p>
            </div>
            <div class="flex flex-row items-center justify-end gap-2 shrink-0">
                <button id="btnNewEntry"
                    class="h-12 bg-emerald-600 text-white px-6 rounded-xl font-bold flex items-center gap-2 shadow-xl shadow-emerald-600/20 hover:scale-105 active:scale-95 transition-all whitespace-nowrap text-sm">
                    <span class="material-symbols-outlined text-xl">add_shopping_cart</span>
                    Nova Entrada
                </button>
                <button id="btnTransfer"
                    class="h-12 bg-slate-900 text-white px-6 rounded-xl font-bold flex items-center gap-2 shadow-xl shadow-slate-900/10 hover:scale-105 active:scale-95 transition-all whitespace-nowrap text-sm">
                    <span class="material-symbols-outlined text-xl">swap_horiz</span>
                    Transferir
                </button>
            </div>
        </header>

        <!-- Tabs -->
        <div class="flex gap-8 border-b border-slate-200 mb-8 overflow-x-auto no-scrollbar">
            <button data-tab="inventory"
                class="tab-btn px-2 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap tab-active">
                <span class="material-symbols-outlined text-lg">inventory</span> Inventário Geral
            </button>
            <button data-tab="catalog"
                class="tab-btn px-2 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap">
                <span class="material-symbols-outlined text-lg">list_alt</span> Catálogo de Materiais
            </button>
            <button data-tab="tools"
                class="tab-btn px-2 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap">
                <span class="material-symbols-outlined text-lg">construction</span> Ferramentas
            </button>
            <button data-tab="warehouses"
                class="tab-btn px-2 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap">
                <span class="material-symbols-outlined text-lg">warehouse</span> Armazéns
            </button>
            <button data-tab="movements"
                class="tab-btn px-2 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap">
                <span class="material-symbols-outlined text-lg">history</span> Histórico
            </button>
        </div>

        <!-- Main Content Area -->
        <div id="tabContent" class="min-h-[400px]">
            <!-- Loading state -->
            <div class="flex items-center justify-center py-20">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#2afc8d]"></div>
            </div>
        </div>
    </main>

    <!-- Modals (Initially Hidden) -->
    <div id="modalContainer"></div>

    <script src="../../shared/session.js" type="module"></script>
    <script src="./stock.js" type="module"></script>
</body>

</html>
