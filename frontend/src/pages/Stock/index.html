<!DOCTYPE html>
<html class="light" lang="pt">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Info Gestor - Logística &amp; Stock</title>
    <link rel="icon" href="../../assets/icon/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="/assets/styles/tailwind-app.css" rel="stylesheet" />
    <link href="/assets/styles/shared-ui.css" rel="stylesheet" />
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
        }
        .tab-active {
            color: #080808;
            border-bottom: 2px solid #2afc8d;
        }
        /* Tab labels: hide text on small screens, show icon only */
        @media (max-width: 640px) {
            .tab-label { display: none; }
            .tab-btn { padding-left: 0.75rem; padding-right: 0.75rem; gap: 0; }
        }
    </style>
</head>

<body class="bg-surface font-body text-on-surface antialiased pb-20">
    <!-- ═══════════════ TOP NAV ═══════════════ -->
    <nav class="fixed top-0 w-full z-50 bg-[#0F172A] border-b border-slate-800 transition-all duration-300">
        <div class="max-w-[1440px] mx-auto px-4 md:px-8 h-16 flex justify-between items-center">

            <!-- Left: Logo + Desktop Links -->
            <div class="flex items-center gap-10">
                <a href="../Dashboard/index.html" class="text-xl font-bold text-white tracking-tight flex items-center gap-2">
                    <span class="w-14 h-8 bg-[#2afc8d] rounded-lg flex items-center justify-center text-[#0F172A] font-black italic">Info</span>
                    <span>Gestor</span>
                </a>
                <div class="hidden lg:flex items-center gap-6">
                    <a class="text-sm font-semibold text-slate-400 hover:text-white transition-colors" href="../Dashboard/index.html">Dashboard</a>
                    <a class="text-sm font-semibold text-slate-400 hover:text-white transition-colors" href="../Clientes/clienteLista.html">Clientes</a>
                    <a class="text-sm font-semibold text-slate-400 hover:text-white transition-colors" href="../Projectos/ProjectGeral.html">Obras</a>
                    <a class="text-sm font-semibold text-[#2afc8d] transition-all bg-[#2afc8d]/10 px-3 py-1.5 rounded-lg" href="./index.html">Logística</a>
                </div>
            </div>

            <!-- Right: User + Logout + Hamburger -->
            <div class="flex items-center gap-4">
                <a data-nav-users class="hidden px-3 py-1.5 rounded-lg text-xs font-bold text-white/80 hover:text-white hover:bg-white/10 transition-all flex items-center gap-2" href="../Users/index.html">
                    <span class="material-symbols-outlined text-lg">manage_accounts</span>
                    Gestão
                </a>
                <button data-user-profile class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold text-[#2afc8d] hover:bg-[#2afc8d]/10 transition-all">
                    <span class="material-symbols-outlined text-sm">person</span>
                    <span data-user-role></span>
                </button>
                <button data-logout class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-bold text-white/60 hover:text-white transition-all">Sair</button>
                <button id="mobileMenuBtn" aria-expanded="false"
                    class="lg:hidden w-10 h-10 flex items-center justify-center rounded-xl bg-slate-800 text-slate-400 hover:text-white transition-colors">
                    <span class="material-symbols-outlined">menu</span>
                </button>
            </div>
        </div>

        <!-- Mobile Dropdown (same structure as all other pages) -->
        <div id="navMenu" class="hidden lg:hidden flex-col bg-[#0F172A] border-b border-slate-800 px-4 pb-6 gap-1">
            <a data-nav-dashboard class="flex items-center gap-3 text-sm font-semibold text-slate-400 py-3 px-4 rounded-xl hover:bg-slate-800 transition-all" href="../Dashboard/index.html">
                <span class="material-symbols-outlined text-lg">dashboard</span> Dashboard
            </a>
            <a class="flex items-center gap-3 text-sm font-semibold text-slate-400 py-3 px-4 rounded-xl hover:bg-slate-800 transition-all" href="../Clientes/clienteLista.html">
                <span class="material-symbols-outlined text-lg">group</span> Clientes
            </a>
            <a class="flex items-center gap-3 text-sm font-semibold text-slate-400 py-3 px-4 rounded-xl hover:bg-slate-800 transition-all" href="../Projectos/ProjectGeral.html">
                <span class="material-symbols-outlined text-lg">construction</span> Obras
            </a>
            <a data-nav-logistics class="flex items-center gap-3 text-sm font-semibold text-[#2afc8d] py-3 px-4 rounded-xl hover:bg-slate-800 transition-all" href="../Stock/index.html">
                <span class="material-symbols-outlined text-lg">inventory_2</span> Logística
            </a>
            <button data-logout class="flex items-center gap-3 text-left text-sm font-semibold text-red-400 py-3 px-4 rounded-xl hover:bg-red-400/10 transition-all mt-2">
                <span class="material-symbols-outlined text-lg">logout</span> Sair
            </button>
        </div>
    </nav>

    <main class="max-w-[1440px] mx-auto px-4 md:px-8 pt-24 pb-20">

        <!-- ═══════════════ PAGE HEADER ═══════════════ -->
        <header class="flex flex-col sm:flex-row sm:items-end justify-between gap-6 mb-10">
            <div>
                <nav class="flex items-center gap-2 text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">
                    <span>Logística</span>
                    <span class="material-symbols-outlined text-xs">chevron_right</span>
                    <span class="text-[#0d3fd1]">Inventário &amp; Ativos</span>
                </nav>
                <h1 class="text-3xl md:text-4xl font-bold text-slate-900 tracking-tight leading-none mb-2">Gestão Logística</h1>
                <p class="text-slate-500 font-medium text-sm">Controlo profissional de armazéns, materiais e ativos.</p>
            </div>
            <!-- Action Buttons: aligned to the right -->
            <div class="flex items-center justify-end w-full sm:w-auto gap-3 shrink-0">
                <button id="btnTransfer" class="h-11 bg-white border border-slate-200 text-slate-700 px-4 sm:px-6 rounded-xl font-bold flex items-center gap-2 shadow-sm hover:shadow-md hover:border-slate-300 active:scale-95 transition-all text-sm whitespace-nowrap">
                    <span class="material-symbols-outlined text-xl">swap_horiz</span>
                    <span class="hidden sm:inline">Transferir</span>
                </button>
                <button id="btnNewEntry" class="h-11 bg-slate-900 text-[#2afc8d] px-4 sm:px-6 rounded-xl font-bold flex items-center gap-2 shadow-xl shadow-slate-900/10 hover:scale-105 active:scale-95 transition-all text-sm whitespace-nowrap">
                    <span class="material-symbols-outlined text-xl">add_shopping_cart</span>
                    <span class="hidden sm:inline">Nova Entrada</span>
                </button>
            </div>
        </header>

        <!-- ═══════════════ TABS ═══════════════ -->
        <div class="flex gap-1 sm:gap-6 border-b border-slate-200 mb-8 overflow-x-auto no-scrollbar">
            <button data-tab="inventory" class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent tab-active">
                <span class="material-symbols-outlined text-lg">inventory</span>
                <span class="tab-label">Inventário Geral</span>
            </button>
            <button data-tab="catalog" class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent">
                <span class="material-symbols-outlined text-lg">list_alt</span>
                <span class="tab-label">Catálogo</span>
            </button>
            <button data-tab="tools" class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent">
                <span class="material-symbols-outlined text-lg">construction</span>
                <span class="tab-label">Ferramentas</span>
            </button>
            <button data-tab="warehouses" class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent">
                <span class="material-symbols-outlined text-lg">warehouse</span>
                <span class="tab-label">Armazéns</span>
            </button>
            <button data-tab="movements" class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent">
                <span class="material-symbols-outlined text-lg">history</span>
                <span class="tab-label">Histórico</span>
            </button>
            <button data-tab="requests" class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent relative">
                <span class="material-symbols-outlined text-lg">fact_check</span>
                <span class="tab-label">Pedidos de Obra</span>
                <span id="requests_badge" class="hidden absolute top-3 right-0 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
            </button>
            <button data-tab="returns" class="tab-btn px-3 py-4 text-sm font-bold text-slate-400 hover:text-slate-600 transition-all flex items-center gap-2 whitespace-nowrap border-b-2 border-transparent relative">
                <span class="material-symbols-outlined text-lg">undo</span>
                <span class="tab-label">Devoluções</span>
                <span id="returns_badge" class="hidden absolute top-3 right-0 w-2 h-2 bg-blue-500 rounded-full animate-pulse"></span>
            </button>
        </div>

        <!-- ═══════════════ TAB CONTENT ═══════════════ -->
        <div id="tabContent" class="min-h-[400px]">
            <div class="flex items-center justify-center py-20">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#2afc8d]"></div>
            </div>
        </div>
    </main>

    <!-- Modals -->
    <div id="modalContainer"></div>


    <script src="../../shared/session.js" type="module"></script>
    <script src="./stock.js" type="module"></script>
</body>
</html>
