    <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-shell="figma" class="bg-surface font-body text-on-surface antialiased">
    <div id="appHeader"></div>

    <main class="cm-page">
        <header class="cm-head">
            <div>
                <h1 class="cm-title">Requisições de Material</h1>
                <p class="cm-lead">
                    Tudo o que uma obra ou um departamento precisa começa aqui. O armazém entrega do
                    stock que tem; o que não houver segue para compra, sem precisar de outro pedido.
                    As abas são papéis: quem pede, quem decide, quem entrega, quem compra, quem recebe.
                </p>
            </div>
            <div class="cm-head-actions" id="rqHeadActions"></div>
        </header>

        <div class="cm-flow" id="rqFlow"></div>
        <div class="cm-chips" id="rqTabs"></div>
        <div id="rqContent"></div>
        <section class="cm-panel" id="rqWarehouses" style="margin-top:1rem"></section>

    <div id="rqDrawer"></div>
    <div id="modalContainer"></div>
