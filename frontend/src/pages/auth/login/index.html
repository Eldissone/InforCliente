<!DOCTYPE html>
<html lang="pt-pt">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Login | Info</title>
  <link rel="icon" href="/assets/icon/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <link href="/assets/styles/tailwind-app.css" rel="stylesheet" />
  <link href="/assets/styles/shared-ui.css" rel="stylesheet" />
  <link href="/assets/styles/pages/auth-login.css" rel="stylesheet" />
</head>

<body>
  <div class="auth-stage">
    <section class="auth-panel">
      <div class="auth-card">
        <p class="auth-kicker">Bem vindo !</p>
        <h1>Inicie a sua sessão</h1>

        <form id="loginForm">
          <div class="auth-fields">
            <label for="email">Email
              <input id="email" type="email" name="email" placeholder="email@dominio.com" autocomplete="username" required />
            </label>
            <label for="password">Senha
              <span class="auth-password">
                <input id="password" type="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
                <button type="button" id="togglePassword" aria-label="Mostrar senha">
                  <span class="material-symbols-outlined">visibility_off</span>
                </button>
              </span>
            </label>
            <label class="auth-remember">
              <input type="checkbox" />
              Sessão Iniciada
            </label>
          </div>
          <button id="submitBtn" type="submit">Entrar</button>
          <div id="errorBox" class="hidden auth-error"></div>
          <p class="auth-help">Para recuperar a senha, envie um email ao suporte técnico.</p>
        </form>
      </div>
    </section>
    <aside class="auth-hero" aria-hidden="true">
      <img src="/assets/images/login-hero.png" alt="" />
    </aside>
  </div>
  <script type="module" src="./index.js"></script>
</body>

</html>
