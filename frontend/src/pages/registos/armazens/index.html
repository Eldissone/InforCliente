<!DOCTYPE html>
<html class="light" lang="pt">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Info Gestor — Armazéns</title>
    <link rel="icon" href="../../../assets/icon/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
    <link href="/assets/styles/tailwind-app.css" rel="stylesheet" />
    <link href="/assets/styles/shared-ui.css" rel="stylesheet" />
    <link href="/assets/styles/top-nav.css" rel="stylesheet" />
    <link href="/assets/styles/shell.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <link href="/assets/styles/pages/stock.css" rel="stylesheet" />
    <link href="/assets/styles/pages/registry-fichas.css" rel="stylesheet" />
</head>

<body data-shell="figma" class="bg-surface font-body text-on-surface antialiased pb-20" data-stock-view="warehouses">
    <div id="appHeader"></div>
    <main class="rf-page">
        <header class="rf-catalog-head">
            <div>
                <h1 class="rf-title">Armazéns</h1>
                <p class="rf-lead">Localizações, stock e movimentos de cada armazém.</p>
            </div>
            <div class="rf-catalog-actions">
                <button id="btnTransfer" class="rf-ghost" type="button">
                    Transferir
                </button>
                <button id="btnNewEntry" class="rf-submit" type="button">
                    Nova Entrada
                </button>
            </div>
        </header>
        <div id="warehouseFicha" class="rf-ficha-slot"></div>
        <button data-tab="warehouses" data-perm="stock:tab_warehouses" class="tab-btn registry-perm-sentinel" type="button" tabindex="-1" aria-hidden="true"></button>
        <div id="tabContent" class="min-h-[400px]">
            <div class="flex items-center justify-center py-20">
                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-[#2afc8d]"></div>
            </div>
        </div>
    </main>

    <div id="modalContainer"></div>
    <div id="imageLightbox">
        <div class="close-btn" id="closeLightbox" role="button" tabindex="0" aria-label="Fechar">
            <span class="material-symbols-outlined text-3xl">close</span>
        </div>
        <div class="lightbox-content">
            <img id="lightboxImage" src="" alt="Preview" />
        </div>
        <div class="lightbox-info">
            <h3 id="lightboxTitle" class="text-2xl font-black text-[#2afc8d] mb-1"></h3>
        </div>
    </div>

    <script src="/Stock/stock.js" type="module"></script>
</body>

</html>
