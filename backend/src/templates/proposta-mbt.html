@page { size: A4; margin: 0; }
:root{
 --navy:#273747; --ink:#1e2b3c; --mut:#5d6b7a; --line:#dfe6ec; --tint:#f2f6f8; --tint2:#eaf6f5;
 --green:#6cc38c; --teal:#30bfbd; --tealdk:#17908c; --blue:#1a92ce; --indigo:#3853a4;
 --grad:linear-gradient(90deg,#6cc38c,#30bfbd 45%,#1a92ce 75%,#3853a4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#9aa4ad}
body{font-family:InterW,Inter,Arial,sans-serif;color:var(--ink);font-size:9.5pt;line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}
b{font-weight:600}
.P{font-family:PoppinsW,Poppins,Arial,sans-serif}
#barra{position:sticky;top:0;z-index:9;background:#273747;color:#fff;padding:8px 16px;display:flex;gap:12px;align-items:center;font:500 13px PoppinsW,Arial}
#barra button{background:#30bfbd;color:#fff;border:0;border-radius:4px;padding:6px 14px;font:600 13px PoppinsW,Arial;cursor:pointer}
@media print{#barra{display:none}html,body{background:#fff}.page{margin:0!important;box-shadow:none!important}}

.page{width:210mm;height:297mm;position:relative;overflow:hidden;background:#fff;margin:8mm auto;box-shadow:0 2px 12px rgba(0,0,0,.25);page-break-after:always;break-after:page;display:flex;flex-direction:column}
.hdr{height:21mm;padding:9mm 16mm 0;display:flex;justify-content:space-between;align-items:flex-start;flex:none}
.hdr-l{display:flex;gap:3mm;align-items:center;font:600 7pt PoppinsW,Arial;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.hdr-l .ref{color:var(--navy);border:1px solid var(--navy);padding:.6mm 2mm;border-radius:1mm}
.hdr-logo{height:10mm}
.body{flex:1;padding:3mm 16mm 5mm;min-height:0;overflow:hidden}
.ftr{flex:none;height:14mm;background:var(--navy);color:#c8d3dd}
.ftr-stripe{height:1.3mm;background:var(--grad)}
.ftr-in{display:flex;justify-content:space-between;align-items:center;padding:2.2mm 16mm 0}
.ftr-t{font-size:6.2pt;line-height:1.55}
.ftr-t b{color:#fff}
.pno{font:600 9.5pt PoppinsW,Arial;color:#fff;display:flex;align-items:center;gap:2mm}
.pno:before{content:"";width:6mm;height:.5mm;background:var(--teal)}

p{margin:0 0 3mm;text-align:justify;hyphens:auto}
.lead{font-size:10.3pt;color:#33475a}
.muted{color:var(--mut)}
.ic{width:7mm;height:7mm;flex:none}
.eyebrow{font:600 7.3pt PoppinsW,Arial;letter-spacing:.2em;text-transform:uppercase;color:var(--tealdk);margin-bottom:1.5mm}
.blk{margin-bottom:3mm}
.H1{display:flex;align-items:baseline;gap:4mm;margin:3mm 0 3.5mm;padding-bottom:2.5mm;border-bottom:.5mm solid var(--line);position:relative}
.H1:after{content:"";position:absolute;left:0;bottom:-.5mm;width:22mm;height:.5mm;background:var(--grad)}
.H1 .n{font:700 22pt/1 PoppinsW,Arial;color:var(--teal)}
.H1 h1{font:700 16pt/1.15 PoppinsW,Arial;color:var(--navy)}
h2{font:600 12pt PoppinsW,Arial;color:var(--navy);margin:4mm 0 2.5mm;display:flex;align-items:center;gap:2.6mm}
h2 .n{font-size:8.3pt;color:var(--navy);border:1px solid var(--navy);padding:.3mm 2mm;border-radius:1.2mm}
h3{font:600 10.3pt PoppinsW,Arial;color:var(--navy);margin:3mm 0 2.5mm;display:flex;align-items:center;gap:2.5mm}
h3 .n{font-size:7.8pt;color:var(--blue);border:1px solid var(--blue);padding:.2mm 1.8mm;border-radius:1.2mm}
.arr{display:inline-block;width:5mm;height:.45mm;background:currentColor;position:relative;vertical-align:middle;margin:0 1.6mm}
.arr:after{content:"";position:absolute;right:-.3mm;top:-.9mm;border-left:1.4mm solid currentColor;border-top:1.13mm solid transparent;border-bottom:1.13mm solid transparent}

/* cover (white, ink-light) */
.cover .cv{flex:1;display:flex;flex-direction:column;padding:16mm 18mm 8mm;position:relative}
.cv-top{display:flex;justify-content:space-between;align-items:flex-start}
.cv-logo{height:19mm}
.cv-ref{text-align:right;font-size:8.5pt;line-height:1.6;color:var(--mut);border-right:1mm solid var(--teal);padding-right:3mm}
.cv-ref b{color:var(--navy);font-family:PoppinsW,Arial}
.cv-kicker{display:flex;align-items:center;gap:3mm;font:600 8.6pt PoppinsW,Arial;letter-spacing:.24em;text-transform:uppercase;color:var(--tealdk);margin-top:22mm}
.cv-kicker span{width:12mm;height:.6mm;background:var(--grad)}
.cv-kicker{margin-top:18mm}
.cv-cli{margin-top:8mm;border-left:1.6mm solid var(--teal);padding:1.5mm 0 1.5mm 5mm}
.cv-cli span{display:block;font:600 7.6pt InterW,Arial;letter-spacing:.24em;text-transform:uppercase;color:var(--tealdk)}
.cv-cli b{display:block;font:700 21pt/1.12 PoppinsW,Arial;color:var(--ink);letter-spacing:-.01em;margin-top:1mm}
.cv-cli small{display:block;font:500 9.5pt InterW,Arial;color:var(--mut);margin-top:1mm}
.cv-slog{margin-top:9mm;height:92mm;border:1px solid var(--line);border-radius:3mm;position:relative;overflow:hidden;background:#fff}
.cv-slog svg{position:absolute;right:0;bottom:0;width:100%;height:100%}
.cv-slog.bg{border:0;border-radius:0;height:112mm;margin-top:6mm;overflow:hidden}
.cv-slog .tx2{position:absolute;left:0;bottom:4mm}.cv-slog .tx2 i{display:block;width:14mm;height:.8mm;background:var(--grad);margin-bottom:3mm}.cv-slog .tx2 h2{font:700 24pt/1.1 PoppinsW,Arial;color:var(--navy);margin:0}.cv-slog .tx2 h2 em{font-style:normal;color:var(--teal)}
.page.cv-foto{background-color:#fff;background-repeat:no-repeat;background-position:0 0;background-size:210mm 258mm}
.cv-fslog{position:absolute;left:18mm;top:153mm}
.cv-fslog i{display:block;width:15mm;height:.8mm;background:var(--grad);margin-bottom:5mm}
.cv-foto .cv-logo{height:23mm}.cv-foto .cv{padding-top:13mm}.cv-foto .cv-kicker{margin-top:15mm}.cv-foto .cv-kpis b{font-size:19pt}.cv-foto .cv-title{font-size:30pt}
.cv-fslog h2{display:block;font:700 30pt/1.08 PoppinsW,Arial;color:var(--navy);letter-spacing:-.015em;margin:0}
.cv-fslog h2 em{font-style:normal;color:var(--teal)}
.cv-slog.only{height:auto;padding:10mm 0}.cv-slog.only .tx{position:static;margin-left:8mm}
.cv-slog .tx{position:absolute;left:8mm;top:9mm;width:66mm}
.cv-slog .tx i{display:block;width:14mm;height:.8mm;background:var(--grad);margin-bottom:4mm}
.cv-slog .tx h2{display:block;font:700 22pt/1.12 PoppinsW,Arial;color:var(--navy);letter-spacing:-.015em;margin:0}
.cv-slog .tx h2 em{font-style:normal;color:var(--teal)}
.cv-slog .tx p{font:400 9.3pt/1.5 InterW,Arial;color:var(--mut);margin:4mm 0 0;text-align:left}
.cv-title{font:700 28pt/1.08 PoppinsW,Arial;margin:5mm 0 5mm;letter-spacing:-.02em;color:var(--navy)}
.cv-title em{font-style:normal;color:var(--teal)}
.cv-route{font:500 12.5pt PoppinsW,Arial;color:#3a4c5e;display:flex;align-items:center;flex-wrap:wrap}
.cv-route .arr{color:var(--teal)}
.cv-img{margin-top:9mm;height:112mm;border-radius:3mm;background-size:cover;background-position:center;position:relative;overflow:hidden}
.cv-img .tag{position:absolute;left:4mm;bottom:4mm;background:#fff;border-radius:2mm;padding:2.6mm 4mm;box-shadow:0 1mm 3mm rgba(0,0,0,.15)}
.cv-img .tag span{display:block;font:500 6.8pt InterW,Arial;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.cv-img .tag b{font:600 11pt PoppinsW,Arial;color:var(--navy);letter-spacing:.03em}
.cv-kpis{margin-top:auto;display:grid;gap:3mm;padding-top:6mm}
.cv-kpis div{border-top:1mm solid var(--teal);padding-top:2.4mm}
.cv-kpis div:nth-child(2){border-color:var(--blue)}.cv-kpis div:nth-child(3){border-color:var(--green)}.cv-kpis div:nth-child(4){border-color:var(--indigo)}
.cv-kpis b{font:700 17pt PoppinsW,Arial;color:var(--navy)}
.cv-kpis small{font:600 9pt PoppinsW,Arial;color:var(--tealdk);margin-left:1mm}

    if(f.itens?.length) x+=`<div class="feat" style="grid-template-columns:repeat(${Math.min(4,f.itens.length)},1fr)">${f.itens.map(it=>`<div>${ic(it.icone)}<b>${esc(it.titulo)}</b><span>${esc(it.texto)}</span></div>`).join('')}</div>`;

    add(h('div','blk',x));
  });
  extras('condicoes');
  // quadro resumo
  const QR=D.quadro_resumo;
  if(QR){
    const cols=QR.colunas||[];
    let rows=(QR.linhas||[]).map(l=>`<tr><th>${esc(l.obra)}</th>${cols.map(c=>`<td><b>${fmtQ(l[c.chave])}</b> ${esc(c.unidade||'')}</td>`).join('')}</tr>`).join('');
    if(QR.mostrar_total) rows+=`<tr class="tot"><th>Total</th>${cols.map(c=>`<td><b>${fmtQ((QR.linhas||[]).reduce((s,l)=>s+Number(l[c.chave]||0),0))}</b> ${esc(c.unidade||'')}</td>`).join('')}</tr>`;
    add(h('div','blk',H2('Quadro Resumo')+(QR.texto?`<p>${QR.texto}</p>`:'')+`<table class="res"><thead><tr><th>Obra</th>${cols.map(c=>`<th>${ic(c.icone)}${esc(c.rotulo)}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>`));
  }
  extras('quadro');
  const TR=D.tracado;
  if(TR){
    add(h('div','blk',H2('Traçado de Execução')+(TR.texto?`<p>${TR.texto}</p>`:'')+`<div class="crit">${(TR.criterios||[]).map(c=>`<div><div class="crit-i">${ic(c.icone)}</div><b>${esc(c.titulo)}</b><span>${esc(c.texto)}</span></div>`).join('')}</div>`));
    (TR.mapas||[]).forEach(m=>add(h('div','blk',H3(esc(m.titulo))+`<figure class="fig"><img src="${m.imagem}" style="height:${m.altura_mm||90}mm">${m.legenda?`<figcaption><b>${esc(m.legenda)}</b></figcaption>`:''}</figure>`)));
  }
  if(!TR&&hasX('tracado')) add(h('div','blk',H2('Traçado de Execução')));
  extras('tracado');
  // cronograma
  const CR=D.cronograma;
  if(CR&&CR.actividades?.length){
    section('Cronograma');
    const A=CR.actividades, fases=CR.fases||[];
    const st=A.map(a=>a.inicio).sort()[0], en=A.map(a=>a.fim).sort().slice(-1)[0];
    const miles=[['Arranque',st]];
    fases.forEach((f,k)=>{ const fa=A.filter(a=>a.fase===f.id); if(!fa.length) return;
      if(k>0) miles.push([`Início · ${f.id?('Fase '+f.id):f.nome}`, fa.map(a=>a.inicio).sort()[0]]);
      if(k<fases.length-1) miles.push([`Fim · ${f.id?('Fase '+f.id):f.nome}`, fa.map(a=>a.fim).sort().slice(-1)[0]]); });
    miles.push(['Conclusão',en]);
    miles.sort((a,b)=>a[1]<b[1]?-1:1);
    add(h('div','blk',H2('Cronograma de Execução')+(CR.texto?`<p>${CR.texto}</p>`:'')+`<div class="miles" style="grid-template-columns:repeat(${miles.length},1fr)">${miles.map(m=>`<div><span>${esc(m[0])}</span><b>${fdl(m[1])}</b></div>`).join('')}</div>`));
    // table grouped: phase -> activity name -> segments
    let rows='';
    const groups=fases.length?fases:[{id:undefined,nome:''}];
    groups.forEach((f,k)=>{
      const fa=A.filter(a=>f.id===undefined||a.fase===f.id); if(!fa.length) return;
      if(f.nome) rows+=`<tr class="ph k${k%2} keep"><td colspan="4">${esc(f.nome)}</td></tr>`;
      const names=[...new Set(fa.map(a=>a.nome))];
      names.forEach(nm=>{ const segs=fa.filter(a=>a.nome===nm);
        segs.forEach((s,j)=>{ rows+=`<tr><td>${j===0?esc(nm):''}</td><td>${fd(s.inicio)}</td><td>${fd(s.fim)}</td><td class="r">${days(s.inicio,s.fim)}</td></tr>`; }); });
    });
    addTable({cls:'crono',html:'<thead><tr><th>Fase / Actividade</th><th>Início</th><th>Fim</th><th class="r">Duração (dias)</th></tr></thead>'}, rows,
      '<h3 style="margin-top:0">Cronograma de Execução Geral</h3>', '<div class="pl-cont">Cronograma de Execução Geral (continuação)</div>');
    const GR=[]; (fases.length?fases:[{id:undefined,nome:''}]).forEach((f,k)=>{ const fa=A.filter(a=>f.id===undefined||a.fase===f.id); if(!fa.length) return;
      if(f.nome) GR.push({ph:f.nome,k}); [...new Set(fa.map(a=>a.nome))].forEach(nm=>GR.push({nm,k,segs:fa.filter(a=>a.nome===nm)})); });
    const CH=24, leg=`<div class="legend">${fases.map((f,k)=>`<span><i style="background:${k%2?'#3853a4':'#30bfbd'}"></i>${esc(f.nome)}</span>`).join('')}<span>Valores nas barras: duração em dias</span></div>`;
    for(let i=0;i<GR.length;i+=CH){ add(h('div','blk',`<h3>Diagrama de Gantt${i?' (continuação)':''}</h3><div class="gantt-wrap">${gantt(A,GR.slice(i,i+CH))}</div>`+(i+CH>=GR.length?leg:''))); }
  }
  if(hasX('cronograma')){ if(!(CR&&CR.actividades?.length)){ section('Cronograma'); add(h('div','blk',H2('Cronogramas'))); } extras('cronograma'); }
  if(hasX('equipamentos')){ section('Meios e Equipamentos'); add(h('div','blk',H2('Meios e Equipamentos'))); extras('equipamentos'); }
  function gantt(A,rows){
    const MS=864e5; const st=pd(A.map(a=>a.inicio).sort()[0]); const en=pd(A.map(a=>a.fim).sort().slice(-1)[0]);
    const s0=new Date(st-7*MS), e0=new Date(+en+10*MS);
    const W=690, lab=200, rh=24, top=30; const H=top+rows.length*rh+8; const sx=d=>lab+(W-lab-6)*(d-s0)/(e0-s0);
    let s=`<svg viewBox="0 0 ${W} ${H}" class="gantt">`;
    let m=new Date(Date.UTC(s0.getUTCFullYear(),s0.getUTCMonth()+1,1)), firstM=true;
    while(m<e0){ const nx=new Date(Date.UTC(m.getUTCFullYear(),m.getUTCMonth()+1,1)); const x=sx(m);
      s+=`<line x1="${x}" y1="${top-6}" x2="${x}" y2="${H-4}" class="g-grid"/>`;
      const lbl=MES[m.getUTCMonth()]+((firstM||m.getUTCMonth()===0)?' '+String(m.getUTCFullYear()).slice(2):'');
      s+=`<text x="${(x+sx(nx<e0?nx:e0))/2}" y="${top-11}" class="g-m">${lbl}</text>`; firstM=false; m=nx; }
    let y=top;
    rows.forEach(r=>{ const col=r.k%2?'#3853a4':'#30bfbd', colT=r.k%2?'#3853a4':'#17908c';
      if(r.ph){ s+=`<text x="0" y="${y+rh*.66}" class="g-ph" fill="${colT}">${esc(r.ph.toUpperCase())}</text><line x1="0" y1="${y+rh-2}" x2="${W}" y2="${y+rh-2}" class="g-sep"/>`; y+=rh; return; }
      const nm=r.nm.length>34?r.nm.slice(0,33)+'…':r.nm; s+=`<text x="6" y="${y+rh*.65}" class="g-l">${esc(nm)}</text>`;
      r.segs.forEach(a=>{ const x1=sx(pd(a.inicio)), x2=sx(new Date(+pd(a.fim)+MS)); const w=Math.max(3,x2-x1);
        s+=`<rect x="${x1}" y="${y+5}" width="${w}" height="${rh-10}" rx="${(rh-10)/2}" fill="${col}"/>`;
        if(w>24) s+=`<text x="${x1+6}" y="${y+rh*.65}" class="g-d">${days(a.inicio,a.fim)}d</text>`; });
      y+=rh; });
    return s+'</svg>';
  }
  // organograma
  const OR=D.organograma;
  if(OR&&OR.diagramas?.length){
    section('Organização da Obra');
    add(h('div','blk',H2('Organograma')+(OR.texto?`<p>${OR.texto}</p>`:'')));
    OR.diagramas.forEach(dg=>add(h('div','blk',H3(esc(dg.titulo))+orgHTML(dg.raiz))));
  }
  if(hasX('organograma')){ if(!(OR&&OR.diagramas?.length)){ section('Organização da Obra'); add(h('div','blk',H2('Organização da Obra'))); } extras('organograma'); }
  function nd(n,d){ const leaf=!(n.filhos&&n.filhos.length)&&!n.nome; return `<div class="nd ${leaf?'leaf':'d'+Math.min(d,3)}"><b>${esc(n.cargo)}</b>${n.nome?`<span>${esc(n.nome)}</span>`:''}</div>`; }
  function flat(n,d,out){ out.push(nd(n,d)); (n.filhos||[]).forEach(c=>flat(c,d+1,out)); return out; }
  function orgHTML(r){
    let chain='', n=r, d=0;
    while(n.filhos && n.filhos.length===1 && n.filhos[0].filhos && n.filhos[0].filhos.length){ chain+=nd(n,d)+'<div class="vl"></div>'; n=n.filhos[0]; d++; }
    chain+=nd(n,d);
    const kids=n.filhos||[];
    if(!kids.length) return `<div class="org"><div class="ochain">${chain}</div></div>`;
    const k=kids.length, pct=50/k;
    return `<div class="org"><div class="ochain">${chain}<div class="vl"></div></div><div class="orow ${k>3?'many':''}" style="grid-template-columns:repeat(${k},1fr)"><i style="position:absolute;top:0;left:${pct}%;right:${pct}%;height:.45mm;background:#9fb1c0"></i>${kids.map(c=>`<div class="ocol">${flat(c,Math.max(2,d+1),[]).join('')}</div>`).join('')}</div></div>`;
  }
  // execução / QSA / exclusões
  if(D.execucao_trabalhos?.length){ section('Qualidade, Segurança e Ambiente');
    add(h('div','blk',H2('Execução dos Trabalhos')+`<div class="exec" style="grid-template-columns:repeat(${Math.min(3,D.execucao_trabalhos.length)},1fr)">${D.execucao_trabalhos.map(x=>`<div>${ic(x.icone)}<p>${x.texto}</p></div>`).join('')}</div>`)); }
  extras('execucao');
  if(D.qualidade_seguranca_ambiente?.length){ section('Qualidade, Segurança e Ambiente');
    add(h('div','blk',H2('Qualidade, Segurança e Ambiente')+`<div class="qsa"><div class="qsa-b"><div>${ic('check')}Qualidade</div><div>${ic('shield')}Segurança</div><div>${ic('leaf')}Ambiente</div></div><div>${D.qualidade_seguranca_ambiente.map(p=>`<p>${p}</p>`).join('')}</div></div>`)); }
  if(D.exclusoes?.length){
    add(h('div','blk',H3('Limites de Fornecimento / Exclusões')+`<p>No preço estimado e apresentado, estão excluídos os seguintes equipamentos ou trabalhos:</p><ul class="excl">${D.exclusoes.map(e=>`<li>${ic('x')}<span>${e}</span></li>`).join('')}</ul>`)); }
  extras('qsa');

  // ---------- COMMERCIAL
  const C=D.comercial||{};
  section('Condições Comerciais',{newpage:true});
  const loteIva=l=> l.total_com_iva!=null?Number(l.total_com_iva):round2(loteTotal(l)*(1+iva));
  const grandIva=round2(lotes.reduce((s,l)=>s+loteIva(l),0));
  const cards=lotes.map(l=>{ const T=loteTotal(l);
    return `<div class="mcard"><div class="mc-top"><span>${esc(l.designacao?.split(' ')[0]||'Lote')}</span><h4>${esc(l.nome)}</h4><b>${fmt(T)}</b><small>${moeda} sem IVA</small></div>
    <div class="sbar">${l.capitulos.map((c,k)=>`<i style="width:${capTotal(c)/T*100}%;background:${CAPCOL[k%CAPCOL.length]}"></i>`).join('')}</div>
    <ul class="mlist">${l.capitulos.map((c,k)=>`<li><i style="background:${CAPCOL[k%CAPCOL.length]}"></i><span>${esc(c.designacao_curta||c.designacao)}</span><b>${fmt(capTotal(c),0)}</b><em>${fmt(capTotal(c)/T*100,1)}%</em></li>`).join('')}</ul></div>`;}).join('');
  add(h('div','blk',H1('Condições Comerciais')));
  extras('comercial');

  const PLHEAD=`<colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"><col class="c7"></colgroup>
  <thead><tr class="g"><th colspan="4"></th><th colspan="2">Preço unitário (${moeda})</th><th></th></tr>
  <tr><th>Item</th><th>Designação</th><th class="c">Un.</th><th class="r">Qtd.</th><th class="r">Material</th><th class="r">Serviço</th><th class="r">Valor total</th></tr></thead>`;
  const PLHEAD_PU=`<colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c6"><col class="c7"></colgroup>
  <thead><tr><th>Item</th><th>Designação</th><th class="c">Un.</th><th class="r">Qtd.</th><th class="r">Preço unitário (${moeda})</th><th class="r">Valor total</th></tr></thead>`;
  if(!C.sem_lista) lotes.forEach((l,li)=>{
    const T=loteTotal(l), pu=l.colunas==='pu', lab=l.colunas==='fm'?['Fornecimento','Montagem']:['Material','Serviço'];
    section(`${C.titulo_lista||'Lista de Preços'} · ${l.nome}`,{newpage:li>0});
    n2++; const num=`${n1}.${n2}`; const title=`${C.titulo_lista||'Lista de Preços'} – ${l.designacao||l.nome}`;
    toc.push({n:num,t:title,id:'t'+num,l:1});
    let rows='';
    l.capitulos.forEach(c=>{
      const q=c.quantidade!=null?`${fmtQ(c.quantidade)} ${esc(c.unidade||'')}`:'';
      rows+=`<tr class="cap keep"><td class="it">${esc(c.numero)}</td><td colspan="${pu?3:4}">${esc(c.designacao)}</td><td class="r capq" colspan="2">${q}</td></tr>`;
      c.itens.forEach(it=>{ const t=lineTotal(it);
        const puv=(Number(it.preco_material)||0)+(Number(it.preco_servico)||0);
        rows+=pu?`<tr class="${t===0?'z':''}"><td class="it">${esc(it.item)}</td><td>${esc(it.designacao)}</td><td class="c">${esc(it.unidade||'')}</td><td class="r">${fmtQ(it.quantidade)}</td><td class="r">${fmt(puv)}</td><td class="r tt">${fmt(t)}</td></tr>`
          :`<tr class="${t===0?'z':''}"><td class="it">${esc(it.item)}</td><td>${esc(it.designacao)}</td><td class="c">${esc(it.unidade||'')}</td><td class="r">${fmtQ(it.quantidade)}</td><td class="r">${it.preco_material==null?'':fmt(it.preco_material)}</td><td class="r">${fmt(it.preco_servico)}</td><td class="r tt">${fmt(t)}</td></tr>`; });
      rows+=pu?`<tr class="sub"><td></td><td colspan="3">Subtotal · ${esc(c.designacao)}</td><td class="r" colspan="2">${fmt(capTotal(c))}</td></tr>`:`<tr class="sub"><td></td><td colspan="4">Subtotal · ${esc(c.designacao)}</td><td class="r" colspan="2">${fmt(capTotal(c))}</td></tr>`;
    });
    {const cs=pu?2:3,TI=loteIva(l);
     rows+=`<tr class="grand"><td></td><td colspan="3">Total sem IVA · ${esc(l.designacao||l.nome)}</td><td class="r" colspan="${cs}">${fmt(T)} <small>${moeda}</small></td></tr>`;
     rows+=`<tr class="sub"><td></td><td colspan="3">IVA (${fmt(iva*100,0)}%)</td><td class="r" colspan="${cs}">${fmt(TI-T)} <small>${moeda}</small></td></tr>`;
     rows+=`<tr class="grand"><td></td><td colspan="3">Total com IVA · ${esc(l.designacao||l.nome)}</td><td class="r" colspan="${cs}">${fmt(TI)} <small>${moeda}</small></td></tr>`;}
    addTable({cls:'pl',html:pu?PLHEAD_PU:PLHEAD.replace('<th class="r">Material</th><th class="r">Serviço</th>',`<th class="r">${lab[0]}</th><th class="r">${lab[1]}</th>`)}, rows,
      `<div class="pl-title"><div class="H1" data-toc="t${num}"><span class="n">${num}</span><h1>${esc(title)}</h1></div></div>`,
      `<div class="pl-cont">${num} · ${esc(title)} (continuação)</div>`);
  });
  section('Condições Comerciais',{newpage:!C.sem_lista});
  const vt=lotes.map(l=>{const T=loteTotal(l); return `<tr><th>${esc(l.nome)}</th><td>${fmt(T)} ${moeda}</td><td>${fmt(loteIva(l))} ${moeda}</td></tr>`;}).join('')+
    `<tr class="tot"><th>Total Geral</th><td>${fmt(grand)} ${moeda}</td><td>${fmt(grandIva)} ${moeda}</td></tr>`;
  add(h('div','blk',H2('Regime da Empreitada')+(C.regime?`<p>${C.regime}</p>`:'')+`<p>${C.sem_lista?'O valor global para a execução da empreitada é de:':'O valor total da presente proposta, tomando por base as quantidades apresentadas na lista de preços, é de:'}</p><table class="vt"><thead><tr><th>Obra</th><th>Sem IVA</th><th>Com IVA (${fmt(iva*100,0)}%)</th></tr></thead><tbody>${vt}</tbody></table>`));
  if(C.pagamento?.length) add(h('div','blk',H2('Condições de Pagamento')+`<p>Propomos as seguintes condições de pagamento:</p><div class="pay" style="grid-template-columns:repeat(${Math.min(4,C.pagamento.length)},1fr)">${C.pagamento.map((p,k)=>`<div><em>${'abcdefgh'[k]}</em><b>${esc(p.destaque)}</b><span>${esc(p.texto)}</span></div>`).join('')}</div>`));
  if(C.garantia) add(h('div','blk',H2('Garantia')+`<div class="hl">${ic('shield')}<div><b>${esc(C.garantia.titulo)}</b><span>${esc(C.garantia.texto)}</span></div></div>`));
  if(hasX('financeiro')){ add(h('div','blk',H2('Cronograma Financeiro'))); extras('financeiro'); }
  section('Prazos e Contactos');
  if(D.prazo) add(h('div','blk',H1('Início / Prazo de Execução dos Trabalhos')+`<div class="hl">${ic('cal')}<div><b>${esc(D.prazo.titulo)}</b><span>${esc(D.prazo.texto)}</span></div></div>`));
  if(D.recepcao||D.validade){
    add(h('div','two blk',`<div>${D.recepcao?H1('Recepção da Obra')+`<p>${D.recepcao}</p>`:''}</div><div>${D.validade?H1('Validade da Proposta')+`<p>${D.validade}</p>`:''}</div>`));
  }
  const K=D.contactos;
  if(K){
    const ini=s=>s.split(/\s+/).filter(Boolean).map(w=>w[0]).filter(c=>c===c.toUpperCase()).slice(0,2).join('');
    add(h('div','blk',H1('Contactos Directos')+(K.texto?`<p>${K.texto}</p>`:'')+`<div class="people">${(K.pessoas||[]).map(p=>`<div><span class="av">${esc(ini(p.nome))}</span><div><em>${esc(p.cargo)}</em><b>${esc(p.nome)}</b><span>${ic('phone','ic')
      .replace('class="ic"','class="ic" style="width:3.5mm;height:3.5mm;vertical-align:-.6mm"')} ${esc(p.telefone)}</span></div></div>`).join('')}</div>`+
      `<div class="office"><div>${ic('pin')}<div><em>Morada profissional</em><b>${K.morada_profissional||''}</b></div></div><div>${ic('phone')}<div>${K.telefone?`<em>Telefone</em><b>${esc(K.telefone)}</b>`:''}${K.fax?`<em style="margin-top:2mm">Fax</em><b>${esc(K.fax)}</b>`:''}</div></div></div>`));
    add(h('div','sign blk',`<p style="margin-top:5mm">${esc(K.fecho||'')}</p><p>De V. Exas.,<br>Atentamente,</p>${(K.assinatura?.img&&/^(data:image\/|https:)/.test(K.assinatura.img))?`<img class="sig-img" src="${esc(K.assinatura.img)}" alt="Assinatura"><div class="sig-line" style="margin-top:0"></div>`:'<div class="sig-line"></div>'}<b>${esc(K.assinatura?.nome||'')}</b><span>${esc(K.assinatura?.cargo||'')} · ${esc(E.nome||'MBT Energia')}</span>`));
  }

  if(hasX('anexos')){ section('Anexos',{newpage:true}); add(h('div','blk',H1('Anexos'))); extras('anexos'); }
  // ---------- page numbers + TOC
  const pages=[...root.querySelectorAll('.page')];
  pages.forEach((p,k)=>{const n=p.querySelector('.pno'); if(n) n.textContent=String(k+1).padStart(2,'0');});
  const pageOf=id=>{const el=root.querySelector(`[data-toc="${id}"]`); return el?pages.indexOf(el.closest('.page'))+1:'';};
  document.getElementById('tocnav').innerHTML=toc.map(t=>`<div class="toc-r l${t.l}"><span class="toc-n">${t.n}</span><span class="toc-t">${t.t}</span><span class="toc-d"></span><span class="toc-p">${pageOf(t.id)}</span></div>`).join('');
  document.getElementById('estado').textContent=`${pages.length} páginas · ${lotes.length} lote(s) · total ${fmt(grand)} ${moeda}`;
  document.body.dataset.ready='1';
}
window.MBTProposta={render};
function start(){
  const raw=document.getElementById('dados-proposta').textContent.trim();
  if(!raw||raw.startsWith('/*')) return;
  render(JSON.parse(raw));
}
const ready=()=>Promise.all([...document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;})));
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{ start(); return ready(); }).then(()=>{
  // re-run once images have their final size (layout may change)
  const raw=document.getElementById('dados-proposta').textContent.trim(); if(raw&&!raw.startsWith('/*')) render(JSON.parse(raw)); document.body.dataset.done='1'; });
})();
</script>
</body>
